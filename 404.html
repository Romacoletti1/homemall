    :root{
      --cream:#faf6ee; --ink:#2a1f18; --gold:#c9a24a; --gold2:#ecd9a0;
      --line:#9c7426; --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;}
    body{
      min-height:100dvh;
      display:flex;align-items:center;justify-content:center;
      padding:32px 22px;
      color:var(--ink);
      font-family:var(--serif);
      background:radial-gradient(120% 90% at 50% 32%,#fdf8f0 0%,#fbf5ea 40%,#efe2c8 100%);
    }
    main{
      width:min(520px,100%);
      text-align:center;
    }
    .marca{
      width:min(148px,36vw);
      height:auto;
      margin:0 auto 18px;
      display:block;
    }
    .nombre{
      margin:0;
      font-family:var(--serif);
      font-weight:600;
      font-size:clamp(1.15rem,4.6vw,1.55rem);
      letter-spacing:.34em;
      text-indent:.34em;
      text-transform:uppercase;
      color:#6e5218;
    }
    .filete{
      display:block;
      width:min(180px,50%);
      height:1px;
      margin:22px auto 18px;
      background:linear-gradient(90deg,transparent,#c9a24a 18%,#9c7426 50%,#c9a24a 82%,transparent);
      border:0;
    }
    h1{
      margin:0;
      font-family:var(--serif);
      font-style:italic;
      font-weight:500;
      font-size:clamp(2.15rem,10vw,3.35rem);
      line-height:1.1;
      color:#3a2a0c;
    }
    .lanzamiento{
      margin:16px 0 0;
      font-family:var(--serif);
      font-weight:600;
      font-size:clamp(.72rem,3.2vw,.9rem);
      letter-spacing:.22em;
      text-transform:uppercase;
      color:#8c6d2f;
    }
