<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago recibido · Dra. Roma Coletti</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/marca/icono-32.png">
<link rel="apple-touch-icon" href="assets/img/marca/icono-180.png">
<link rel="stylesheet" href="assets/fuentes.css">
<link rel="stylesheet" href="assets/estilos.css">
<style>body{overflow:auto;display:block}.espera{position:fixed;opacity:1;visibility:visible}</style>
</head>
<body>
<!-- Página de retorno para proveedores de pago con "URL de pago exitoso" (Izipay, Culqi, Niubiz, Mercado Pago…).
     Lee la cita guardada en este dispositivo y abre WhatsApp con los datos y "Ya pagué". -->
<div class="layer espera open">
  <div class="ecard">
    <span class="big">✦</span>
    <p class="step">Dra. Roma Coletti · Cirugía Plástica</p>
    <h2>¡Pago recibido!</h2>
    <div class="ecita" id="cita"></div>
    <input id="op" placeholder="N° de operación (opcional)">
    <button class="wa" id="enviar">Enviar comprobante por WhatsApp</button>
    <p class="fine">Envía también la captura de tu comprobante. Coordinaremos contigo <b>la fecha y la hora por WhatsApp</b> y te enviaremos el enlace de Zoom.</p>
    <a class="link" href="index.html#consultorio">← Volver al consultorio</a>
  </div>
</div>
<script src="assets/catalogo.js"></script>
<script src="assets/citas-comun.js"></script>
<script>
(function () {
  const C = window.CitasComun;
  const num = TIENDAS.find((t) => t.id === "consultorio").whatsapp.replace(/\D/g, "");
  let citas = []; try { citas = JSON.parse(localStorage.getItem(C.CITAS_KEY) || "[]"); } catch (e) {}
  const q = new URLSearchParams(location.search);
  const cod = q.get("codigo") || localStorage.getItem(C.PENDIENTE_KEY);
  const cita = citas.find((c) => c.codigo === cod) || citas[citas.length - 1] || null;
  const box = document.getElementById("cita");
  box.innerHTML = cita
    ? `<span>Tu solicitud</span><strong>${cita.tipoNombre}</strong><small>${cita.nombre} · ${C.monto(cita.moneda, cita.monto)} · Código ${cita.codigo}</small>`
    : `<span>No encontramos tu solicitud en este dispositivo</span><small>No te preocupes: envíanos tu comprobante por WhatsApp y coordinamos tu cita.</small>`;
  document.getElementById("enviar").onclick = () => {
    const op = document.getElementById("op").value.trim();
    let txt;
    if (cita) {
      cita.pago = { metodo: "enlace de pago", operacion: op, fecha: new Date().toISOString() }; cita.estado = "pago_reportado";
      try { localStorage.setItem(C.CITAS_KEY, JSON.stringify(citas)); localStorage.removeItem(C.PENDIENTE_KEY); } catch (e) {}
      txt = C.mensajeCita(cita, NOMBRE_CENTRO);
    } else {
      txt = `Hola Dra. Roma Coletti, vengo de ${NOMBRE_CENTRO}. ✅ Ya pagué mi videoconsulta${op ? " (N° de operación: " + op + ")" : ""}. Les envío la captura de mi comprobante para coordinar por WhatsApp la fecha, la hora y el enlace de Zoom.`;
    }
    location.href = `https://wa.me/${num}?text=${encodeURIComponent(txt)}`;
  };
})();
</script>
</body>
</html>
