<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" role="img" aria-label="Zona de las bolsas de Bichat: parte baja de las mejillas">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#D9B46A" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#D9B46A" stop-opacity=".35"/>
      <stop offset="1" stop-color="#D9B46A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="140" height="160" rx="16" fill="#FAF6EE"/>
  <!-- zonas de Bichat (debajo del pómulo, delante del masetero) -->
  <ellipse cx="45" cy="99" rx="13" ry="10" fill="url(#g)"/>
  <ellipse cx="95" cy="99" rx="13" ry="10" fill="url(#g)"/>
  <g fill="none" stroke="#B8924A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- rostro -->
    <path d="M70 18c-24 0-38 18-38 44 0 12 2 24 6 36 5 16 15 32 32 36 17-4 27-20 32-36 4-12 6-24 6-36 0-26-14-44-38-44z"/>
    <!-- cabello -->
    <path d="M32 58c2-22 14-38 38-38s36 16 38 38c-8-12-20-20-38-21-14 0-28 7-38 21z" stroke-width="1.6"/>
    <!-- cejas y ojos -->
    <path d="M47 61c5-3 11-3 16 0M77 61c5-3 11-3 16 0" stroke-width="1.8"/>
    <path d="M48 70c4-3 10-3 14 0M78 70c4-3 10-3 14 0" stroke-width="1.7"/>
    <!-- nariz -->
    <path d="M70 70v20c-2 3-6 4-7 2M70 90c2 3 6 4 7 2" stroke-width="1.7"/>
    <!-- labios -->
    <path d="M59 108c4-3 8-3 11-1 3-2 7-2 11 1-4 4-7 6-11 6s-7-2-11-6z" stroke-width="1.7"/>
    <!-- pómulos -->
    <path d="M40 80c5 3 10 4 15 3M100 80c-5 3-10 4-15 3" stroke-width="1.3" opacity=".7"/>
  </g>
  <!-- marcas de la zona -->
  <g fill="none" stroke="#B8924A" stroke-width="1.2" stroke-dasharray="2.5 2.5">
    <ellipse cx="45" cy="99" rx="9" ry="6.5"/>
    <ellipse cx="95" cy="99" rx="9" ry="6.5"/>
  </g>
</svg>
