<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e3"/>
      <stop offset="100%" stop-color="#e8d7b0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ead6"/>
      <stop offset="100%" stop-color="#d9c49a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e7a8"/><stop offset="50%" stop-color="#c9a24a"/><stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fff6d6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#efe4c8"/>
  <rect x="0" y="0" width="1600" height="420" fill="url(#ceil)"/>
  <!-- cove -->
  <ellipse cx="800" cy="80" rx="620" ry="50" fill="none" stroke="#e8c56b" stroke-width="8" opacity=".7"/>
  <rect x="80" y="40" width="1440" height="18" rx="4" fill="url(#gold)" opacity=".55"/>
  <!-- back wall panels -->
  <g fill="#f6efe0" stroke="#d9c49a" stroke-width="3">
    <rect x="120" y="130" width="260" height="340" rx="6"/>
    <rect x="410" y="130" width="260" height="340" rx="6"/>
    <rect x="930" y="130" width="260" height="340" rx="6"/>
    <rect x="1220" y="130" width="260" height="340" rx="6"/>
  </g>
  <!-- stage / backdrop (blank, no text) -->
  <rect x="690" y="150" width="220" height="320" rx="8" fill="#fbf6ea" stroke="#c9a24a" stroke-width="8"/>
  <rect x="704" y="164" width="192" height="292" rx="4" fill="#f3e6c4"/>
  <!-- chandeliers -->
  <g fill="#e8c56b" stroke="#8a6420" stroke-width="1.5">
    <g transform="translate(400,90)">
      <line x1="0" y1="-50" x2="0" y2="0" stroke="#c9a24a"/>
      <circle r="8"/><circle cx="-28" cy="18" r="6"/><circle cx="28" cy="18" r="6"/>
      <circle cx="-16" cy="32" r="5"/><circle cx="16" cy="32" r="5"/>
    </g>
    <g transform="translate(800,70)">
      <line x1="0" y1="-50" x2="0" y2="0" stroke="#c9a24a"/>
      <circle r="10"/><circle cx="-36" cy="20" r="7"/><circle cx="36" cy="20" r="7"/>
      <circle cx="-20" cy="38" r="6"/><circle cx="20" cy="38" r="6"/>
    </g>
    <g transform="translate(1200,90)">
      <line x1="0" y1="-50" x2="0" y2="0" stroke="#c9a24a"/>
      <circle r="8"/><circle cx="-28" cy="18" r="6"/><circle cx="28" cy="18" r="6"/>
      <circle cx="-16" cy="32" r="5"/><circle cx="16" cy="32" r="5"/>
    </g>
  </g>
  <ellipse cx="800" cy="200" rx="500" ry="160" fill="url(#glow)"/>
  <!-- floor -->
  <polygon points="0,470 1600,470 1600,900 0,900" fill="url(#floor)"/>
  <g stroke="#c9a24a" stroke-width="3" opacity=".45" fill="none">
    <line x1="0" y1="470" x2="1600" y2="470"/>
    <path d="M0 900 L800 470 L1600 900"/>
    <path d="M200 900 L800 470 L1400 900"/>
    <line x1="0" y1="700" x2="1600" y2="700" opacity=".5"/>
  </g>
  <!-- gold inlay diamonds -->
  <g fill="none" stroke="#b08d3c" stroke-width="2" opacity=".4">
    <path d="M800 780 l60 30 l-60 30 l-60 -30 z"/>
    <path d="M400 820 l40 20 l-40 20 l-40 -20 z"/>
    <path d="M1200 820 l40 20 l-40 20 l-40 -20 z"/>
  </g>
  <!-- side chairs suggestion -->
  <g fill="#f6efe0" stroke="#c9a24a" stroke-width="2">
    <rect x="70" y="560" width="36" height="46" rx="4"/><rect x="70" y="548" width="36" height="12" rx="3"/>
    <rect x="120" y="575" width="36" height="46" rx="4"/><rect x="120" y="563" width="36" height="12" rx="3"/>
    <rect x="1494" y="560" width="36" height="46" rx="4"/><rect x="1494" y="548" width="36" height="12" rx="3"/>
    <rect x="1444" y="575" width="36" height="46" rx="4"/><rect x="1444" y="563" width="36" height="12" rx="3"/>
  </g>
</svg>